# 本地 subprocess 沙箱的 tool 配置（替代官方 sandbox_fusion_tool_config.yaml）。
#
# 与官方配置的唯一区别：class_name 指向我们的 LocalCodeTool（纯 Python 子进程
# 执行），而不是需要独立部署 HTTP 服务的 CustomSandboxFusionTool。
#
# 用法：launch 脚本里
#   actor_rollout_ref.rollout.multi_turn.tool_config_path=recipe/retool/local_tool_config.yaml
# 且必须在包含 `recipe/` 包的目录下运行（class_name 走 importlib 动态导入）。
tools:
  - class_name: "recipe.retool.local_code_tool.LocalCodeTool"
    config:
      default_timeout: 30       # 单次代码执行 wall-clock 上限（秒）
      num_workers: 8            # 并发沙箱上限
      max_output_chars: 4096    # stdout/stderr 各自保留的最大字符数
      type: native

    tool_schema:
      type: "function"
      function:
        name: "code_interpreter"
        # 描述参照官方复现实测"能涨点"的写法：强调 print 输出、每次执行独立无状态。
        description: >-
          A Python code execution environment. Run Python code for calculations,
          data analysis, and other computational tasks. Results are captured from
          the `print()` function output. Execute code in an isolated environment
          (each execution starts fresh). Returns empty string if no output is
          printed. Each execution is independent (no state persistence between runs).
        parameters:
          type: "object"
          properties:
            code:
              type: "string"
              description: "The Python code to be executed."
          required: ["code"]
